<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت چت | مسجد محله</title>
<style>
:root{--neon:#00ff9d;--accent:#ff7a00;--bad:#ff4d4d;}
*{box-sizing:border-box;}
body{margin:0;background:#050607;color:var(--neon);font-family:monospace;padding:20px;}
h1{text-align:center;text-shadow:0 0 10px var(--neon);font-size:22px;}
.wrap{max-width:820px;margin:auto;}
.panel,.login-box{background:rgba(0,255,157,.04);border:1px solid rgba(0,255,157,.3);
  border-radius:16px;padding:20px;margin-bottom:20px;}
label{display:block;margin:10px 0 4px;font-size:14px;opacity:.85;}
input,textarea,select{width:100%;background:#0b0d10;border:1px solid rgba(0,255,157,.3);
  color:var(--neon);border-radius:8px;padding:10px;font-family:monospace;font-size:14px;}
textarea{min-height:70px;resize:vertical;}
button{background:var(--neon);color:#000;border:none;border-radius:10px;padding:10px 16px;
  font-weight:bold;cursor:pointer;margin:6px 6px 0 0;}
button:hover{background:var(--accent);color:#fff;}
button.danger{background:var(--bad);color:#fff;}
.item{border:1px dashed rgba(0,255,157,.35);border-radius:12px;padding:14px;margin-bottom:12px;position:relative;}
.item .row{display:flex;gap:10px;}
.item .row>div{flex:1;}
.msg{margin-top:10px;font-size:13px;min-height:20px;}
.msg.ok{color:var(--neon);}
.msg.err{color:var(--bad);}
.hint{font-size:12px;opacity:.6;line-height:1.7;margin-top:6px;}
.hidden{display:none;}
.status{font-size:14px;line-height:1.8;}
.chat-mod-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.chat-mod-text{flex:1;}
.chat-mod-name{color:var(--accent);font-weight:bold;}
.config-box{background:#050607;padding:10px;border-radius:8px;word-break:break-all;
  font-size:13px;border:1px solid rgba(0,255,157,.2);margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
<h1>💬 مدیریت چت آنلاین</h1>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <label>رمز عبور مدیریت</label>
  <input id="pwInput" type="password" placeholder="رمز عبور را وارد کنید">
  <button onclick="checkPassword()">🔓 ورود</button>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- PANEL -->
<div id="panelArea" class="hidden">
  <p class="hint">این صفحه فقط برای مدیریت چت است و نیاز به توکن گیت‌هاب ندارد. برای ویرایش کانفیگ‌ها از admin.html استفاده کنید.</p>
  <div id="chatAdminHost"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="admin-chat.js"></script>

<script>
// هش SHA-256 رمز عبور — خود رمز اینجا ذخیره نشده، فقط هشش
const ADMIN_PW_HASH = "13f6b597a03d37d0915f555f8ed515d5a171abc4731feafa0ebddd20550d5079".slice(0, 64);
const SESSION_KEY = "chatAdminUnlocked";

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function checkPassword(){
  const msg = document.getElementById("loginMsg");
  const val = document.getElementById("pwInput").value;
  const hash = await sha256Hex(val);

  if(hash === ADMIN_PW_HASH){
    sessionStorage.setItem(SESSION_KEY, "1");
    unlockPanel();
  }else{
    msg.textContent = "❌ رمز عبور اشتباه است.";
    msg.className = "msg err";
  }
}

function unlockPanel(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("panelArea").classList.remove("hidden");

  if (!firebase.apps.length) {
    firebase.initializeApp(window.CHAT_CONFIG.firebase);
  }
  const fbDb = firebase.database();
  ChatAdmin.connect(fbDb);
}

document.getElementById("pwInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") checkPassword();
});

// اگه قبلاً توی همین session وارد شده، دوباره رمز نپرس
window.onload = () => {
  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    unlockPanel();
  }
};
</script>
</body>
</html>
