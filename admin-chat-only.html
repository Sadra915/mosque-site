<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت چت و کاربران | مسجد محله</title>
<style>
:root{--neon:#00ff9d;--accent:#ff7a00;--bad:#ff4d4d;}
*{box-sizing:border-box;}
body{margin:0;background:#050607;color:var(--neon);font-family:monospace;padding:20px;}
h1{text-align:center;text-shadow:0 0 10px var(--neon);font-size:22px;}
.wrap{max-width:820px;margin:auto;}
.panel,.login-box{background:rgba(0,255,157,.04);border:1px solid rgba(0,255,157,.3);
  border-radius:16px;padding:20px;margin-bottom:20px;}
label{display:block;margin:10px 0 4px;font-size:14px;opacity:.85;}
input,textarea,select{width:100%;background:#0b0d10;border:1px solid rgba(0,255,157,.3);
  color:var(--neon);border-radius:8px;padding:10px;font-family:monospace;font-size:14px;}
textarea{min-height:70px;resize:vertical;}
button{background:var(--neon);color:#000;border:none;border-radius:10px;padding:10px 16px;
  font-weight:bold;cursor:pointer;margin:6px 6px 0 0;}
button:hover{background:var(--accent);color:#fff;}
button.danger{background:var(--bad);color:#fff;}
.item{border:1px dashed rgba(0,255,157,.35);border-radius:12px;padding:14px;margin-bottom:12px;position:relative;}
.item .row{display:flex;gap:10px;}
.item .row>div{flex:1;}
.msg{margin-top:10px;font-size:13px;min-height:20px;}
.msg.ok{color:var(--neon);}
.msg.err{color:var(--bad);}
.hint{font-size:12px;opacity:.6;line-height:1.7;margin-top:6px;}
.hidden{display:none;}
.status{font-size:14px;line-height:1.8;}
.chat-mod-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.chat-mod-text{flex:1;}
.chat-mod-name{color:var(--accent);font-weight:bold;}
</style>
</head>
<body>
<div class="wrap">
<h1>🛠 مدیریت چت و کاربران</h1>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <p class="hint">ورود با همون حساب ادمینی که در Firebase مسیر <code>admins/</code> برایش تعریف شده.</p>
  <label>ایمیل</label>
  <input id="adminEmail" type="email" placeholder="ایمیل ادمین">
  <label>رمز عبور</label>
  <input id="adminPassword" type="password" placeholder="رمز عبور">
  <button onclick="adminLogin()">🔑 ورود</button>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- PANEL -->
<div id="panelArea" class="hidden">
  <div class="panel">
    <p class="status">وارد شده به‌عنوان: <b id="whoAmI"></b></p>
    <button class="danger" onclick="adminLogout()">🚪 خروج</button>
  </div>

  <div id="usersAdminHost"></div>
  <div id="chatAdminHost"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="admin-chat.js"></script>
<script src="users-admin.js"></script>

<script>
if (!firebase.apps.length) firebase.initializeApp(window.CHAT_CONFIG.firebase);
const auth = firebase.auth();
const db = firebase.database();

function adminLogin(){
  const msg = document.getElementById("loginMsg");
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  if(!email || !password){
    msg.textContent = "ایمیل و رمز رو وارد کن.";
    msg.className = "msg err";
    return;
  }

  msg.textContent = "در حال ورود...";
  msg.className = "msg";

  auth.signInWithEmailAndPassword(email, password)
    .catch(e => {
      msg.textContent = "❌ ایمیل یا رمز اشتباه است.";
      msg.className = "msg err";
    });
}

function adminLogout(){
  auth.signOut();
}

auth.onAuthStateChanged((user) => {
  const msg = document.getElementById("loginMsg");

  if(!user){
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("panelArea").classList.add("hidden");
    return;
  }

  // چک می‌کنیم آیا این کاربر واقعاً توی مسیر admins هست یا نه
  db.ref("admins/" + user.uid).once("value")
    .then((snap) => {
      if(!snap.exists()){
        msg.textContent = "❌ این حساب دسترسی مدیریت ندارد.";
        msg.className = "msg err";
        auth.signOut();
        return;
      }

      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("panelArea").classList.remove("hidden");
      document.getElementById("whoAmI").textContent = user.email;

      ChatAdmin.connect(db);
      UsersAdmin.connect(db);
    })
    .catch(() => {
      // Rules رد دسترسی می‌کنه یعنی این حساب اصلاً ادمین نیست
      msg.textContent = "❌ این حساب دسترسی مدیریت ندارد.";
      msg.className = "msg err";
      auth.signOut();
    });
});
</script>
</body>
</html>
